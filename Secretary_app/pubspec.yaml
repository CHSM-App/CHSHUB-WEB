name: secretary_app
description: "Society Management Secretary App"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  intl: any

  # State & Storage
  flutter_riverpod: ^2.4.9
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.2.2

  # Networking
  dio: ^5.7.0
  retrofit: 4.9.2
  connectivity_plus: ^7.0.0

  # Serialization
  json_annotation: ^4.9.0

  # UI
  cupertino_icons: ^1.0.8
  fl_chart: ^0.69.2
  image_picker: ^1.0.4
  file_picker: ^8.1.6
  url_launcher: ^6.2.5

  # PDF export & printing for maintenance bills
  pdf: ^3.11.1
  printing: ^5.13.4
  path_provider: ^2.1.5
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Code generation
  retrofit_generator: ^10.2.1
  json_serializable: ^6.8.0
  build_runner: ^2.5.4

flutter:
  uses-material-design: true
