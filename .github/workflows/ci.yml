name: CI

# Per-surface validation for every deployable component. Runs on PRs and on
# push to main. Deployment (split-branches.yml) is gated on the same checks.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (test + audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # Fail only on critical advisories (moderate/low are tracked in
      # docs/BACKEND-HARDENING.md and need deliberate major bumps).
      - name: Security audit
        run: npm audit --audit-level=critical
      - name: Tests
        run: |
          set -e
          for t in test/*.test.js; do echo "== $t =="; node "$t"; done

  frontend:
    name: Frontend (build + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # xlsx highs are documented (migration to exceljs pending); don't block CI on them.
      - name: Security audit (non-blocking)
        run: npm audit --audit-level=critical || true
      - name: Build
        run: npm run build
      - name: Vitest
        run: npx vitest run

  flutter:
    name: Flutter (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { folder: CHSHUB_APP, name: Resident }
          - { folder: security_app, name: Security }
          - { folder: Secretary_app, name: Secretary }
    defaults:
      run:
        working-directory: ${{ matrix.folder }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze
        run: flutter analyze
      # Golden tests are excluded from CI: they are sensitive to font rendering on
      # the runner and must be regenerated deliberately, never blind-overwritten
      # (see docs/PRODUCTION-GO-LIVE-CHECKLIST.md). Logic tests run normally.
      - name: Test
        run: |
          FILES=$(find test -name '*_test.dart' ! -name '*golden*' 2>/dev/null || true)
          if [ -n "$FILES" ]; then flutter test $FILES; else echo "no non-golden tests"; fi
      - name: Release build validation
        run: flutter build apk --release
